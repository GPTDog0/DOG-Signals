<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐕 DOG ANALYTICS PRO</title>
<style>
:root {
  --bg-dark: #0a0b0d;
  --panel-bg: rgba(20, 22, 26, 0.85);
  --accent-gold: #ffb703;
  --accent-green: #02c39a;
  --accent-red: #e63946;
  --border-color: rgba(255, 183, 3, 0.15);
  --text-main: #e2e8f0;
  --text-muted: #94a3b8;
}

body {
  margin: 0;
  font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg-dark);
  color: var(--text-main);
  overflow-x: hidden;
}

#bgCanvas {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
  opacity: 0.2;
}

/* Header */
header {
  padding: 20px;
  text-align: center;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--accent-gold);
  border-bottom: 1px solid var(--border-color);
  background: rgba(10, 11, 13, 0.9);
  backdrop-filter: blur(10px);
}

/* Main Layout */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

/* Auth Block */
#authBlock {
  max-width: 400px;
  margin: 100px auto;
  padding: 30px;
  background: var(--panel-bg);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

input {
  width: 80%;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.1);
  background: #111317;
  color: #fff;
  font-size: 16px;
  text-align: center;
  outline: none;
  transition: 0.3s;
}
input:focus {
  border-color: var(--accent-gold);
}

/* Buttons styling */
button {
  padding: 12px 24px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  color: #000;
  background: var(--accent-gold);
  transition: all 0.25s ease;
}
button:hover {
  transform: translateY(-1px);
  box-shadow: 0 5px 15px rgba(255, 183, 3, 0.3);
}
button:disabled {
  opacity: 0.3;
  transform: none !important;
  box-shadow: none !important;
  cursor: not-allowed;
}

/* Dashboard Panels */
.dashboard-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
}
@media(min-width: 768px) {
  .dashboard-grid {
    grid-template-columns: 1.2fr 1fr;
  }
}

.panel {
  background: var(--panel-bg);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 24px;
  backdrop-filter: blur(12px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
}

/* Tabs */
.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}
.tab-btn {
  background: rgba(255,255,255,0.05);
  color: var(--text-muted);
  border: 1px solid rgba(255,255,255,0.05);
  flex: 1;
}
.tab-btn.activeTab {
  background: rgba(255, 183, 3, 0.1) !important;
  color: var(--accent-gold) !important;
  border: 1px solid var(--accent-gold) !important;
}

/* Signal Card */
.signalCard {
  background: rgba(15, 17, 20, 0.95);
  border: 1px solid rgba(255,255,255,0.05);
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  margin: 15px 0;
  position: relative;
  overflow: hidden;
}
.signalCard.active-trade {
  border-color: var(--accent-gold);
}
.signalCard.dogon-active {
  border-color: #ff5500;
  background: rgba(40, 15, 0, 0.2);
}

.signalArrow {
  font-size: 36px;
  font-weight: 800;
  margin: 10px 0;
}
.up { color: var(--accent-green); }
.down { color: var(--accent-red); }

/* Live Price Ticker in Signal */
.live-tracker {
  background: rgba(0,0,0,0.3);
  padding: 8px 15px;
  border-radius: 30px;
  display: inline-block;
  margin: 10px 0;
  font-family: monospace;
  font-size: 16px;
}

.loader {
  width: 40px; height: 40px;
  border: 3px solid rgba(255,183,3,0.1);
  border-top: 3px solid var(--accent-gold);
  border-radius: 50%;
  margin: 20px auto;
  animation: spin 1s linear infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

/* Stats Panel */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 15px;
}
.stat-box {
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.05);
  padding: 12px;
  border-radius: 8px;
  text-align: center;
}
.stat-val {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent-gold);
}

/* Selectors */
select {
  width: 100%;
  padding: 12px;
  background: #111317;
  border: 1px solid rgba(255,255,255,0.1);
  color: #fff;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
  margin-bottom: 12px;
}
select:focus {
  border-color: var(--accent-gold);
}

/* Time Warning */
.time-warning {
  background: rgba(230, 57, 70, 0.1);
  border: 1px solid var(--accent-red);
  color: #ffcbd1;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  font-weight: 600;
  margin-bottom: 20px;
  display: none;
}

/* Action Buttons for Win/Loss manual input */
.action-btn-container {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 15px;
}
.btn-win {
  background: var(--accent-green) !important;
  color: #000 !important;
}
.btn-loss {
  background: var(--accent-red) !important;
  color: #fff !important;
}

#tv_chart_container {
  width: 100%; height: 350px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.05);
  overflow: hidden;
  margin-top: 15px;
}
#tv_analysis_container {
  width: 100%; height: 220px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.05);
  overflow: hidden;
  margin-top: 15px;
}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<header>🐕 DOG ANALYTICS PRO</header>

<div class="container">
  <!-- Auth Block -->
  <div id="authBlock">
    <h3 style="margin-top:0; color: var(--accent-gold);">SYSTEM ACCESS</h3>
    <p style="color: var(--text-muted); font-size:14px;">Введите лицензионный ключ доступа</p>
    <input id="accessKey" type="password" placeholder="••••••••">
    <br><br>
    <button id="checkKeyBtn">VERIFY SYSTEM</button>
    <p id="authMessage" style="margin-top:15px; font-weight:600;"></p>
  </div>

  <!-- Main System -->
  <div id="signals" style="display: none;">
    <div class="time-warning" id="timeWarning">
      🔴 СИСТЕМА ВНЕ РАБОЧЕГО ДИАПАЗОНА. РАБОТА С 09:00 ДО 22:00 ПО КИЕВУ.
    </div>

    <div class="tabs">
      <button id="classicBtn" class="tab-btn activeTab">💱 CLASSIC ASSETS</button>
      <button id="otcBtn" class="tab-btn">📊 OTC INTERFACE</button>
    </div>

    <div class="dashboard-grid">
      <!-- Left Panel: Control & Logic -->
      <div class="panel">
        <h3 style="margin-top:0; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom:10px;">
          АНАЛИТИЧЕСКИЙ ТЕРМИНАЛ
        </h3>
        
        <!-- Classic Market Interface -->
        <div id="classicMarket">
          <label style="color: var(--text-muted); font-size:12px; display:block; margin-bottom:5px;">ВЫБОР ВАЛЮТНОЙ ПАРЫ</label>
          <select id="pairSelect">
            <option value="EURUSD">EUR/USD</option>
            <option value="GBPUSD">GBP/USD</option>
            <option value="USDJPY">USD/JPY</option>
            <option value="USDCHF">USD/CHF</option>
            <option value="AUDUSD">AUD/USD</option>
            <option value="NZDUSD">NZD/USD</option>
            <option value="USDCAD">USD/CAD</option>
            <option value="EURGBP">EUR/GBP</option>
            <option value="EURJPY">EUR/JPY</option>
            <option value="GBPJPY">GBP/JPY</option>
            <option value="AUDJPY">AUD/JPY</option>
            <option value="GBPAUD">GBP/AUD</option>
            <option value="CADJPY">CAD/JPY</option>
            <option value="CHFJPY">CHF/JPY</option>
          </select>

          <label style="color: var(--text-muted); font-size:12px; display:block; margin-bottom:5px;">ТАЙМФРЕЙМ СДЕЛКИ</label>
          <select id="tfSelect">
            <option value="3">3 Минуты (3M)</option>
            <option value="5">5 Минут (5M)</option>
            <option value="15">15 Минут (15M)</option>
          </select>

          <div style="display:flex; gap:10px; margin-top:20px;">
            <button id="getSignalBtn" style="flex:2;">ГЕНЕРИРОВАТЬ СИГНАЛ</button>
            <button id="resetSignalBtn" style="flex:1; background:transparent; border:1px solid rgba(255,255,255,0.1); color:#fff;" disabled>RESET</button>
          </div>
        </div>

        <!-- OTC Market Interface -->
        <div id="otcMarket" style="display: none;">
          <label style="color: var(--text-muted); font-size:12px; display:block; margin-bottom:5px;">OTC СЕГМЕНТ</label>
          <select id="otcPairSelect">
            <option value="EURUSD">EUR/USD OTC</option>
            <option value="GBPUSD">GBP/USD OTC</option>
            <option value="USDJPY">USD/JPY OTC</option>
            <option value="EURJPY">EUR/JPY OTC</option>
            <option value="USDCHF">USD/CHF OTC</option>
            <option value="USDCAD">USD/CAD OTC</option>
            <option value="AUDUSD">AUD/USD OTC</option>
            <option value="GBPJPY">GBP/JPY OTC</option>
          </select>

          <label style="color: var(--text-muted); font-size:12px; display:block; margin-bottom:5px;">ТАЙМФРЕЙМ СДЕЛКИ (OTC)</label>
          <select id="otcTfSelect">
            <option value="1">1 Минута (1M)</option>
            <option value="3">3 Минуты (3M)</option>
            <option value="5">5 Минут (5M)</option>
          </select>

          <div style="display:flex; gap:10px; margin-top:20px;">
            <button id="getOtcSignalBtn" style="flex:2;">АНАЛИЗ OTC</button>
            <button id="resetOtcSignalBtn" style="flex:1; background:transparent; border:1px solid rgba(255,255,255,0.1); color:#fff;" disabled>RESET</button>
          </div>
        </div>

        <!-- Output Signal View -->
        <div id="signalDisplay"></div>
      </div>

      <!-- Right Panel: Charts & Stats -->
      <div class="panel">
        <h3 style="margin-top:0; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom:10px;">
          АНАЛИТИКА ТРЕНДА & СТАТИСТИКА
        </h3>
        
        <div class="stats-grid">
          <div class="stat-box">
            <div style="font-size:11px; color: var(--text-muted);">УСПЕШНЫЕ</div>
            <div class="stat-val" id="winCount" style="color: var(--accent-green);">0</div>
          </div>
          <div class="stat-box">
            <div style="font-size:11px; color: var(--text-muted);">МИНУСЫ</div>
            <div class="stat-val" id="lossCount" style="color: var(--accent-red);">0</div>
          </div>
          <div class="stat-box">
            <div style="font-size:11px; color: var(--text-muted);">ВСЕГО СДЕЛОК</div>
            <div class="stat-val" id="totalCount" style="color: #fff;">0</div>
          </div>
          <div class="stat-box">
            <div style="font-size:11px; color: var(--text-muted);">ОКУПАЕМОСТЬ</div>
            <div class="stat-val" id="accuracy">0%</div>
          </div>
        </div>

        <div id="tv_analysis_container"></div>
        <div id="tv_chart_container"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
const VALID_KEY = "DOG2025";
const authBlock = document.getElementById("authBlock");
const checkKeyBtn = document.getElementById("checkKeyBtn");
const accessKey = document.getElementById("accessKey");
const authMessage = document.getElementById("authMessage");
const signals = document.getElementById("signals");
const timeWarning = document.getElementById("timeWarning");

checkKeyBtn.onclick = () => {
  if (accessKey.value.trim() === VALID_KEY) {
    authBlock.style.display = "none";
    signals.style.display = "block";
    checkWorkingHours();
  } else {
    authMessage.textContent = "❌ ЛИЦЕНЗИЯ НЕ НАЙДЕНА";
    authMessage.style.color = "var(--accent-red)";
  }
};

// Проверка рабочего времени по Киеву (09:00 - 22:00)
function isKyivWorkTime() {
  const now = new Date();
  const kyivTimeStr = now.toLocaleString("en-US", {timeZone: "Europe/Kyiv"});
  const kyivDate = new Date(kyivTimeStr);
  const hours = kyivDate.getHours();
  return hours >= 9 && hours < 22;
}

function checkWorkingHours() {
  const isWorking = isKyivWorkTime();
  if (!isWorking) {
    timeWarning.style.display = "block";
    document.getElementById("getSignalBtn").disabled = true;
    document.getElementById("getOtcSignalBtn").disabled = true;
  } else {
    timeWarning.style.display = "none";
    document.getElementById("getSignalBtn").disabled = false;
    document.getElementById("getOtcSignalBtn").disabled = false;
  }
}

// Переключение вкладок
const classicBtn = document.getElementById("classicBtn");
const otcBtn = document.getElementById("otcBtn");
const classicMarket = document.getElementById("classicMarket");
const otcMarket = document.getElementById("otcMarket");

classicBtn.onclick = () => {
  classicMarket.style.display="block"; otcMarket.style.display="none";
  classicBtn.classList.add("activeTab"); otcBtn.classList.remove("activeTab");
  checkWorkingHours();
}
otcBtn.onclick = () => {
  classicMarket.style.display="none"; otcMarket.style.display="block";
  otcBtn.classList.add("activeTab"); classicBtn.classList.remove("activeTab");
  checkWorkingHours();
}

// Загрузка TradingView
function loadTV(pair, tf){
  document.getElementById("tv_chart_container").innerHTML="";
  new TradingView.widget({
    container_id:"tv_chart_container",
    symbol:"FX_IDC:"+pair,
    interval:tf,
    theme:"dark",
    hide_top_toolbar:true,
    width:"100%", height:"100%"
  });
}

function loadAnalysisWidget(pair, tf) {
  const container = document.getElementById("tv_analysis_container");
  container.innerHTML = "";
  let tvInterval = "5m";
  if(tf === "15") tvInterval = "15m";
  const script = document.createElement('script');
  script.src = "https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js";
  script.async = true;
  script.innerHTML = JSON.stringify({
    "interval": tvInterval, "width": "100%", "isTransparent": false, "height": "100%",
    "symbol": "FX_IDC:" + pair, "showIntervalTabs": false, "displayMode": "single", "locale": "ru", "colorTheme": "dark"
  });
  container.appendChild(script);
}

// Статистика
let wins = 0, losses = 0;
function registerResult(isWin) {
  if (isWin) wins++; else losses++;
  const total = wins + losses;
  document.getElementById("winCount").textContent = wins;
  document.getElementById("lossCount").textContent = losses;
  document.getElementById("totalCount").textContent = total;
  document.getElementById("accuracy").textContent = Math.round((wins / (total || 1)) * 100) + "%";
}

let timer = null;

// Расчет точного времени окончания и запуск идеального обратного отсчета
function startPrecisionTimer(durationMinutes, onFinished) {
  const startTimeMs = Date.now();
  const durationMs = durationMinutes * 60 * 1000;
  const targetTimeMs = startTimeMs + durationMs;

  // Рассчитываем точное локальное время закрытия для отображения (HH:MM)
  const targetDate = new Date(targetTimeMs);
  const targetTimeStr = targetDate.toLocaleTimeString("ru-RU", {hour: '2-digit', minute:'2-digit'});

  // Отображаем расчетное время в элементе
  const targetTimeEl = document.getElementById("targetTimeText");
  if (targetTimeEl) targetTimeEl.textContent = targetTimeStr;

  if (timer) clearInterval(timer);

  timer = setInterval(() => {
    const nowMs = Date.now();
    const remainingMs = targetTimeMs - nowMs;
    const remainingSec = Math.max(0, Math.ceil(remainingMs / 1000));

    const timerText = document.getElementById("timerText");
    if (timerText) {
      const minutes = Math.floor(remainingSec / 60);
      const seconds = remainingSec % 60;
      timerText.textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
    }

    if (remainingSec <= 0) {
      clearInterval(timer);
      onFinished();
    }
  }, 250); // Частое обновление предотвращает любые лаги и рассинхроны
}

// Получение реальной базовой цены по паре
function getBaseAssetPrice(pair) {
  const prices = {
    "EURUSD": 1.08520, "GBPUSD": 1.26410, "USDJPY": 151.240, "USDCHF": 0.88710,
    "AUDUSD": 0.65430, "NZDUSD": 0.60250, "USDCAD": 1.35620, "EURGBP": 0.85840,
    "EURJPY": 164.120, "GBPJPY": 191.200, "AUDJPY": 98.950, "GBPAUD": 1.93200,
    "CADJPY": 111.450, "CHFJPY": 170.400
  };
  const base = prices[pair] || 1.00000;
  const dev = (Math.random() - 0.5) * (base * 0.0015);
  return base + dev;
}

// Симуляция плавного изменения цены (для визуала)
let priceSimInterval = null;
function runVisualPrice(pair) {
  let currentPrice = getBaseAssetPrice(pair);
  const isJpy = pair.includes("JPY");

  if (priceSimInterval) clearInterval(priceSimInterval);

  priceSimInterval = setInterval(() => {
    const change = (Math.random() - 0.5) * (isJpy ? 0.015 : 0.00012);
    currentPrice += change;
    const priceEl = document.getElementById("livePriceTracker");
    if (priceEl) {
      priceEl.textContent = currentPrice.toFixed(isJpy ? 3 : 5);
    }
  }, 1000);
}

// Логика запуска сделки
function startSignalProcess(isDogon = false, forcedDir = null, otcMode = false) {
  if (!isKyivWorkTime()) { checkWorkingHours(); return; }

  const pairSelectEl = otcMode ? document.getElementById("otcPairSelect") : document.getElementById("pairSelect");
  const tfSelectEl = otcMode ? document.getElementById("otcTfSelect") : document.getElementById("tfSelect");
  const getBtn = otcMode ? document.getElementById("getOtcSignalBtn") : document.getElementById("getSignalBtn");
  const resetBtn = otcMode ? document.getElementById("resetOtcSignalBtn") : document.getElementById("resetSignalBtn");
  const display = otcMode ? document.getElementById("otcSignalDisplay") : document.getElementById("signalDisplay");

  const pair = pairSelectEl.value;
  
  // ДОГОН всегда жестко на 2 минуты, ОСНОВНАЯ берет таймфрейм из формы
  const durationMinutes = isDogon ? 2 : parseInt(tfSelectEl.value);

  getBtn.disabled = true;
  resetBtn.disabled = false;

  display.innerHTML = `
    <div class="signalCard active-trade">
      <div class="loader"></div>
      <p style="color: var(--text-muted); font-size:13px;">${isDogon ? 'РАСЧЕТ СТРАТЕГИЧЕСКОГО ДОГОНА...' : 'СКАНИРОВАНИЕ ИНДИКАТОРОВ ТЕХ. АНАЛИЗА...'}</p>
    </div>`;

  if (!isDogon && !otcMode) {
    loadAnalysisWidget(pair, tfSelectEl.value);
    loadTV(pair, tfSelectEl.value);
  }

  // Саму сделку выплевываем быстро (за 1 сек вместо 2), чтобы минимизировать рассинхрон при долгом ожидании
  setTimeout(() => {
    let direction = forcedDir || (Math.random() > 0.49 ? "UP" : "DOWN");
    let acc = (72 + Math.random() * 21).toFixed(1);

    display.innerHTML = `
      <div class="signalCard active-trade ${isDogon ? 'dogon-active' : ''}">
        <span style="font-size:11px; background: ${isDogon ? '#ff5500' : 'var(--accent-gold)'}; color:#000; padding:3px 8px; border-radius:4px; font-weight:bold;">
          ${isDogon ? '⚠️ ДОГОН №1 (2 МИНУТЫ)' : 'СДЕЛКА ОТКРЫТА'}
        </span>
        <div class="signalArrow ${direction === 'UP' ? 'up' : 'down'}">
          ${direction === 'UP' ? '📈 ВВЕРХ (BUY)' : '📉 ВНИЗ (SELL)'}
        </div>
        <div class="live-tracker">
          Текущая цена: <span id="livePriceTracker">Загрузка...</span>
        </div>
        <p style="font-size:14px; margin: 5px 0; color: var(--text-muted);">
          Закрытие сделки в: <strong style="color:#fff;" id="targetTimeText">--:--</strong>
        </p>
        <p style="font-size:14px; margin: 5px 0; color: var(--text-muted);">Точность анализа: ${acc}%</p>
        <div style="font-size: 24px; font-weight:bold; margin-top:10px; color: var(--accent-gold);" id="timerText">0:00</div>
      </div>`;

    runVisualPrice(pair);

    // Запуск точнейшего системного таймера
    startPrecisionTimer(durationMinutes, () => {
      if (priceSimInterval) clearInterval(priceSimInterval);
      
      // По истечении времени запрашиваем реальный результат у трейдера
      display.innerHTML = `
        <div class="signalCard ${isDogon ? 'dogon-active' : ''}">
          <span style="font-size:11px; background: var(--accent-gold); color:#000; padding:3px 8px; border-radius:4px; font-weight:bold;">🏁 СИНХРОНИЗАЦИЯ С БРОКЕРОМ</span>
          <h3 style="margin: 15px 0 5px 0; color: #fff;">Каков результат вашей сделки?</h3>
          <p style="font-size:12px; color: var(--text-muted); margin-bottom: 15px;">Бот ожидает вашего подтверждения для калибровки статистики.</p>
          <div class="action-btn-container">
            <button class="btn-win" id="manualWinBtn">✅ В ПЛЮС</button>
            <button class="btn-loss" id="manualLossBtn">❌ В МИНУС</button>
          </div>
        </div>`;

      document.getElementById("manualWinBtn").onclick = () => {
        registerResult(true);
        display.innerHTML = `
          <div class="signalCard" style="border-color: var(--accent-green);">
            <h3 style="color: var(--accent-green); margin:0;">🎉 ПОЗДРАВЛЯЕМ С ПЛЮСОМ!</h3>
            <p style="font-size:13px; color: var(--text-muted); margin-top:5px;">Отличный результат. Торговый цикл успешно завершен.</p>
          </div>`;
        getBtn.disabled = false;
        resetBtn.disabled = true;
      };

      document.getElementById("manualLossBtn").onclick = () => {
        registerResult(false);
        if (!isDogon) {
          // Если основная сделка зашла в минус, мгновенно запускаем догон на 2 минуты в том же направлении
          startSignalProcess(true, direction, otcMode);
        } else {
          // Если догон зашел в минус — останавливаем цикл
          display.innerHTML = `
            <div class="signalCard" style="border-color: var(--accent-red);">
              <h3 style="color: var(--accent-red); margin:0;">🛑 СДЕЛКА ЗАКРЫТА В МИНУС</h3>
              <p style="font-size:13px; color: var(--text-muted); margin-top:5px;">Догон также не зашел. Рекомендуется временно сменить валютную пару или сделать паузу.</p>
            </div>`;
          getBtn.disabled = false;
          resetBtn.disabled = true;
        }
      };
    });

  }, 1000);
}

// Привязка событий к кнопкам запуска
document.getElementById("getSignalBtn").onclick = () => startSignalProcess(false, null, false);
document.getElementById("getOtcSignalBtn").onclick = () => startSignalProcess(false, null, true);

document.getElementById("resetSignalBtn").onclick = () => {
  clearInterval(timer);
  if (priceSimInterval) clearInterval(priceSimInterval);
  document.getElementById("signalDisplay").innerHTML = "";
  document.getElementById("tv_chart_container").innerHTML = "";
  document.getElementById("tv_analysis_container").innerHTML = "";
  document.getElementById("getSignalBtn").disabled = false;
  document.getElementById("resetSignalBtn").disabled = true;
};

document.getElementById("resetOtcSignalBtn").onclick = () => {
  clearInterval(timer);
  if (priceSimInterval) clearInterval(priceSimInterval);
  document.getElementById("otcSignalDisplay").innerHTML = "";
  document.getElementById("getOtcSignalBtn").disabled = false;
  document.getElementById("resetOtcSignalBtn").disabled = true;
};

// Задний фон
const canvas=document.getElementById("bgCanvas"),ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
let particles=[];
for(let i=0;i<60;i++){
  particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,dx:(Math.random()-0.5)*0.5,dy:(Math.random()-0.5)*0.5,size:Math.random()*1.5+1,color:"#ffb703"})
}
function animateParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    p.x+=p.dx;p.y+=p.dy;
    if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;
    if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;
  });
  requestAnimationFrame(animateParticles);
}
animateParticles();
window.onresize=()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
</script>

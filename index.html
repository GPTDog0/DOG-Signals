<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐶 DOG SIGNALS</title>
<style>
body {
  font-family: "Inter", sans-serif;
  background: radial-gradient(circle at top, #1a0000 0%, #000 90%);
  color:#fff;
  text-align:center;
  margin:0;
  padding:0;
  overflow-y:auto;
}
.header {
  background: linear-gradient(180deg, #220000, transparent);
  padding: 18px 0 10px;
  box-shadow:0 0 25px #ff000020;
}
.header h1 {
  color:#ff3b3b;
  font-size:28px;
  font-weight:700;
  margin:0;
  text-shadow:0 0 20px #ff000099;
}
input {
  padding:12px;
  border-radius:10px;
  border:1px solid #330000;
  background:#1a0000;
  color:#ffcccc;
  font-size:16px;
  width:200px;
  margin-top:15px;
  outline:none;
}
button {
  margin-top:15px;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:600;
  padding:10px 20px;
  color:#fff;
  background: linear-gradient(180deg,#ff3b3b,#b30000);
  box-shadow:0 0 12px #ff000040;
  cursor:pointer;
  transition:.25s;
}
button:hover { transform:scale(1.05); box-shadow:0 0 20px #ff000080; }
#authMessage { margin-top:10px; font-size:16px; }
#signals { display:none; margin-top:20px; }
.controls{
  display:flex;
  justify-content:center;
  gap:14px;
  margin:14px auto 18px;
  flex-wrap:wrap;
}
select{
  background:#110000;
  border:1px solid #330000;
  border-radius:10px;
  color:#ffcdcd;
  padding:10px 14px;
  font-size:16px;
  outline:none;
  transition: .2s;
}
select:hover{ border-color:#ff3b3b; box-shadow:0 0 10px #ff000040; }
#tv_chart_container{
  width:94%;
  max-width:450px;
  height:330px;
  margin:10px auto 20px;
  border-radius:12px;
  background:#080000;
  border:1px solid #330000;
  box-shadow:0 0 25px #ff000020;
  overflow:hidden;
  position:relative;
}
#signalDisplay, #otcSignalDisplay {
  font-size:20px;
  margin:15px 0;
  text-shadow:0 0 8px #ff000040;
  min-height:90px;
}
@keyframes blinkUp{0%,100%{color:#4ade80; text-shadow:0 0 15px #22ff22;}50%{color:#fff; text-shadow:0 0 5px #fff;}}
@keyframes blinkDown{0%,100%{color:#ef4444; text-shadow:0 0 15px #ff2222;}50%{color:#fff; text-shadow:0 0 5px #fff;}}
.timer{ animation: blinkUp 1s infinite; }
.activeTab { background: linear-gradient(180deg,#ff6666,#cc0000)!important; }
.small{ width:125px; }
#langSelect {
  position: fixed;
  top: 12px;
  right: 12px;
  background: #1a0000;
  border: 1px solid #330000;
  padding: 8px 12px;
  border-radius: 8px;
  color: #ffcccc;
}
</style>
</head>
<body>

<select id="langSelect">
  <option value="ru">🇷🇺 Русский</option>
  <option value="en">🇬🇧 English</option>
</select>

<div class="header"><h1>🐶 DOG SIGNALS</h1></div>

<div id="authBlock">
  <h2 id="authTitle">👋 Добро пожаловать!</h2>
  <p id="authText">Введите пароль для доступа:</p>
  <input type="password" id="accessKey" placeholder="Введите пароль...">
  <br>
  <button id="checkKeyBtn">🔐 Проверить</button>
  <p id="authMessage"></p>
</div>

<div id="signals">
  <div class="controls">
    <button id="classicBtn" class="activeTab">💱 Обычный рынок</button>
    <button id="otcBtn">📊 OTC рынок</button>
  </div>

  <div id="classicMarket">
    <div class="controls">
      <select id="pairSelect">
        <option>EUR/USD</option><option>GBP/USD</option><option>USD/JPY</option>
        <option>USD/CHF</option><option>AUD/USD</option><option>NZD/USD</option>
      </select>
      <select id="tfSelect">
        <option value="1m">1M</option><option value="3m">3M</option>
        <option value="5m">5M</option><option value="7m">7M</option>
      </select>
    </div>
    <div class="controls">
      <button id="getSignalBtn">🔥 Получить сигнал</button>
      <button id="resetSignalBtn" disabled>♻ Сбросить</button>
    </div>
    <div id="signalDisplay"></div>
    <div id="tv_chart_container"></div>
  </div>

  <div id="otcMarket" style="display:none;">
    <div class="controls">
      <select id="otcPairSelect">
        <option>EUR/USD OTC</option><option>GBP/USD OTC</option>
        <option>USD/JPY OTC</option><option>EUR/JPY OTC</option>
        <option>AUD/USD OTC</option><option>USD/CAD OTC</option>
      </select>
      <select id="otcTfSelect" class="small">
        <option value="random">🎲 Random</option>
        <option value="5s">5 sec</option>
        <option value="10s">10 sec</option>
        <option value="30s">30 sec</option>
        <option value="1m">1 min</option>
      </select>
    </div>
    <div class="controls">
      <button id="getOtcSignalBtn">⚡ OTC Signal</button>
      <button id="resetOtcSignalBtn" disabled>♻ Reset</button>
    </div>
    <div id="otcSignalDisplay"></div>
  </div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
const translations = {
  ru: {
    authText:"Введите пароль для доступа:",
    authWrong:"❌ Неверный пароль!",
    authSuccess:"✅ Пароль верный, доступ открыт!",
    classic:"💱 Обычный рынок",
    otc:"📊 OTC рынок",
    getSignal:"🔥 Получить сигнал",
    reset:"♻ Сбросить",
    getOtc:"⚡ Сигнал OTC",
    up:"📈 Вверх ↑",
    down:"📉 Вниз ↓",
    accuracy:"Точность",
    timer:"Таймер",
    tf:"TF",
    pair:"Пара"
  },
  en: {
    authText:"Enter password to access:",
    authWrong:"❌ Invalid password!",
    authSuccess:"✅ Password correct, access granted!",
    classic:"💱 Classic Market",
    otc:"📊 OTC Market",
    getSignal:"🔥 Get Signal",
    reset:"♻ Reset",
    getOtc:"⚡ OTC Signal",
    up:"📈 Up ↑",
    down:"📉 Down ↓",
    accuracy:"Accuracy",
    timer:"Timer",
    tf:"TF",
    pair:"Pair"
  }
};

const langSelect=document.getElementById("langSelect");
const authTitle=document.getElementById("authTitle");
const authText=document.getElementById("authText");
const checkKeyBtn=document.getElementById("checkKeyBtn");
const classicBtn=document.getElementById("classicBtn");
const otcBtn=document.getElementById("otcBtn");
const getSignalBtn=document.getElementById("getSignalBtn");
const resetSignalBtn=document.getElementById("resetSignalBtn");
const getOtcSignalBtn=document.getElementById("getOtcSignalBtn");
const resetOtcSignalBtn=document.getElementById("resetOtcSignalBtn");

function applyLang(lang){
  const t=translations[lang];
  authText.textContent=t.authText;
  classicBtn.textContent=t.classic;
  otcBtn.textContent=t.otc;
  getSignalBtn.textContent=t.getSignal;
  resetSignalBtn.textContent=t.reset;
  getOtcSignalBtn.textContent=t.getOtc;
}
langSelect.onchange=()=>applyLang(langSelect.value);
applyLang("ru");

const VALID_KEY="DOG2025";
const accessKey=document.getElementById("accessKey");
const authMessage=document.getElementById("authMessage");
const authBlock=document.getElementById("authBlock");
const signals=document.getElementById("signals");

checkKeyBtn.onclick=()=>{
  if(accessKey.value.trim()===VALID_KEY){
    authMessage.style.color="#4ade80";
    authMessage.textContent=translations[langSelect.value].authSuccess;
    authBlock.style.display="none";
    signals.style.display="block";
    localStorage.setItem("dogsignals_access","granted");
  } else {
    authMessage.style.color="#ef4444";
    authMessage.textContent=translations[langSelect.value].authWrong;
  }
}

if(localStorage.getItem("dogsignals_access")==="granted"){
  authBlock.style.display="none";
  signals.style.display="block";
}

const classicMarket=document.getElementById("classicMarket");
const otcMarket=document.getElementById("otcMarket");

classicBtn.onclick=()=>{
  classicMarket.style.display="block";
  otcMarket.style.display="none";
  classicBtn.classList.add("activeTab");
  otcBtn.classList.remove("activeTab");
}

otcBtn.onclick=()=>{
  classicMarket.style.display="none";
  otcMarket.style.display="block";
  otcBtn.classList.add("activeTab");
  classicBtn.classList.remove("activeTab");
}
</script>
</body>
</html>

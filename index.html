<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOG Signals | Вхід</title>
<style>
body {
  font-family: "Inter", sans-serif;
  background: radial-gradient(circle at center, #180000 0%, #000 90%);
  color: #f4f4f4;
  margin: 0; padding: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  height: 100vh;
}
h1 {
  color: #ff2e2e;
  font-weight: 800;
  font-size: 26px;
  margin-bottom: 10px;
  text-shadow: 0 0 12px #ff0000aa;
}
input, button {
  background: linear-gradient(180deg, #1a0000 0%, #000 100%);
  border: 1px solid #ff0000;
  color: #ffcccc;
  padding: 10px;
  border-radius: 8px;
  font-size: 15px;
  width: 220px;
  text-align: center;
  box-shadow: 0 0 10px #ff000055;
  margin: 6px 0;
}
button:hover { background: #ff0000; color: #fff; box-shadow: 0 0 15px #ff0000aa; }

#passwordBox, #loginBox, #mainApp { display: none; text-align: center; }
.active { display: block !important; }

#signalDisplay { margin-top: 15px; min-height: 140px; }
.signal-line { font-size: 15px; margin: 4px 0; }
.result-plus { color: #4ade80; font-weight: 700; }
.result-dogon { color: #facc15; font-weight: 700; }
.result-load { color: #ffaaaa; font-style: italic; }

#tv_chart_container {
  width: 100%; max-width: 600px; height: 350px;
  margin: 15px auto 20px; border-radius: 12px;
  overflow: hidden; box-shadow: 0 0 25px #ff000033;
  background: #0a0000; border: 1px solid #330000;
}
footer { font-size: 12px; color: #ff4444; opacity: 0.7; padding: 8px; }
</style>
<script src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>

<!-- 🧩 ВХІД — ПАРОЛЬ -->
<div id="passwordBox" class="active">
  <h1>🐶 DOG SIGNALS</h1>
  <p>Введіть пароль:</p>
  <input type="password" id="userPassword" placeholder="Пароль">
  <button id="checkPasswordBtn">Увійти</button>
  <div id="passwordStatus" style="margin-top:10px;color:#ffaaaa;"></div>
</div>

<!-- 🧩 ВХІД ПО ID -->
<div id="loginBox">
  <h1>🐶 DOG SIGNALS</h1>
  <p>Введіть ваш ID для входу:</p>
  <input type="text" id="userId" placeholder="Ваш ID">
  <button id="sendIdBtn">Відправити</button>
  <div id="loginStatus" style="margin-top:10px;color:#ffaaaa;"></div>
</div>

<!-- 💹 ОСНОВНИЙ ІНТЕРФЕЙС -->
<div id="mainApp">
  <h1>🐶 DOG SIGNALS</h1>
  <div class="container">
    <select id="pairSelect">
      <option>EUR/USD</option>
      <option>GBP/USD</option>
      <option>USD/JPY</option>
      <option>USD/CHF</option>
      <option>AUD/USD</option>
      <option>NZD/USD</option>
      <option>EUR/JPY</option>
      <option>GBP/JPY</option>
      <option>EUR/GBP</option>
    </select>

    <select id="tfSelect">
      <option value="5s">5S</option>
      <option value="15s">15S</option>
      <option value="3m">3M</option>
      <option value="5m">5M</option>
      <option value="7m">7M</option>
    </select>

    <button id="getSignalBtn">🔥 Отримати сигнал</button>
    <button id="resetSignalBtn" disabled>Скинути сигнал</button>
  </div>

  <div id="signalDisplay"></div>
  <div id="tv_chart_container"></div>
  <footer>© 2025 DOG Signals | Powered by Pocket Option</footer>
</div>

<script>
let timerInterval = null;
const display = document.getElementById("signalDisplay");


// === 🔐 Перевірка ПАРОЛЯ ===
const CORRECT_PASSWORD = "DOG2025";

document.getElementById("checkPasswordBtn").onclick = () => {
  const pass = document.getElementById("userPassword").value.trim();
  const status = document.getElementById("passwordStatus");

  if (!pass) {
    status.innerHTML = "⚠️ Введіть пароль!";
    return;
  }

  if (pass === CORRECT_PASSWORD) {
    document.getElementById("passwordBox").classList.remove("active");
    document.getElementById("loginBox").classList.add("active");
  } else {
    status.innerHTML = "❌ Невірний пароль!";
  }
};


// === 💡 Логін по ID ===
document.getElementById("sendIdBtn").onclick = () => {
  const id = document.getElementById("userId").value.trim();
  const status = document.getElementById("loginStatus");

  if (!id) {
    status.innerHTML = "⚠️ Введіть ваш ID!";
    return;
  }

  status.innerHTML = "⏳ ID відправлено на перевірку...";

  setTimeout(() => {
    const approved = true;

    if (approved) {
      localStorage.setItem("dog_user_id", id);
      document.getElementById("loginBox").classList.remove("active");
      document.getElementById("mainApp").classList.add("active");
    } else {
      status.innerHTML = "❌ Ваш ID відхилено.";
    }
  }, 1200);
};


// === 📊 Графік ===
function tvSymbolFromPair(pair){ return `FX:${pair.replace('/', '').toUpperCase()}`; }
function tvIntervalFromTF(tf){ const map={"5s":"1","15s":"1","3m":"3","5m":"5","7m":"7"}; return map[tf]||"1"; }
function loadTradingView(pair, tf){
  const container = document.getElementById("tv_chart_container");
  container.innerHTML='';
  try {
    new TradingView.widget({
      container_id:"tv_chart_container",
      symbol:tvSymbolFromPair(pair),
      interval:tvIntervalFromTF(tf),
      timezone:"Etc/UTC",
      theme:"dark",
      style:"1",
      locale:"ru",
      hide_side_toolbar:true,
      hide_top_toolbar:true,
      allow_symbol_change:false,
      withdateranges:false,
      enable_publishing:false
    });
  } catch(e) {
    container.innerHTML='<div style="padding:12px;color:#ffaaaa">Помилка завантаження графіка</div>';
  }
}


// === 🎯 Логіка сигналів ===
function getRandomSignal(){ const entries=["UP ↑","DOWN ↓"]; return {entry:entries[Math.floor(Math.random()*entries.length)]}; }
function getPrice(){ return (Math.random()*1.5+1).toFixed(5); }
function computeResult(entryPrice, exitPrice, direction){

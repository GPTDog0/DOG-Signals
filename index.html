<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🐶 DOG SIGNALS</title>

<style>
body {
  font-family: Inter, sans-serif;
  background: radial-gradient(circle at top, #1a0000 0%, #000 90%);
  color:#fff;
  text-align:center;
  margin:0;
}
.header {
  background: linear-gradient(180deg, #220000, transparent);
  padding:18px 0 10px;
}
.header h1 {
  color:#ff3b3b;
  margin:0;
  text-shadow:0 0 20px #ff000099;
}
button {
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:600;
  padding:12px 0;
  width:170px;
  color:#fff;
  background: linear-gradient(180deg,#ff3b3b,#b30000);
  cursor:pointer;
}
button:hover { transform:scale(1.05); }
.controls {
  display:flex;
  justify-content:center;
  gap:14px;
  margin:15px auto;
  flex-wrap:wrap;
}
select, input {
  background:#110000;
  border:1px solid #330000;
  border-radius:10px;
  color:#ffcccc;
  padding:10px;
  font-size:16px;
}
#authBlock { margin-top:60px; }
#signals { display:none; }
.activeTab { background:#cc0000 !important; }
#signalDisplay { font-size:20px; margin-top:15px; }
</style>
</head>

<body>

<div class="header">
  <h1>🐶 DOG SIGNALS</h1>
</div>

<div class="controls">
  <button id="openAuthBtn">🔐 Пароль</button>
</div>

<!-- АВТОРИЗАЦИЯ -->
<div id="authBlock">
  <p>Введите ключ доступа:</p>
  <input type="text" id="accessKey" placeholder="Введите ключ">
  <br><br>
  <button id="checkKeyBtn">Проверить</button>
  <p id="authMessage"></p>
</div>

<!-- СИГНАЛЫ -->
<div id="signals">
  <div class="controls">
    <button id="classicBtn" class="activeTab">💱 Обычный рынок</button>
    <button id="otcBtn">📊 OTC рынок</button>
  </div>

  <div id="classicMarket">
    <div class="controls">
      <select id="pairSelect">
        <option>EUR/USD</option>
        <option>GBP/USD</option>
        <option>USD/JPY</option>
      </select>
      <select id="tfSelect">
        <option value="1">1M</option>
        <option value="5">5M</option>
      </select>
    </div>
    <button id="getSignalBtn">🔥 Получить сигнал</button>
    <div id="signalDisplay"></div>
  </div>

  <div id="otcMarket" style="display:none;">
    <p>OTC будет позже</p>
  </div>
</div>

<script>
const VALID_KEY = "DOG2025";

const authBlock = document.getElementById("authBlock");
const signals = document.getElementById("signals");

openAuthBtn.onclick = () => {
  signals.style.display = "none";
  authBlock.style.display = "block";
  authMessage.textContent = "";
  accessKey.value = "";
};

checkKeyBtn.onclick = () => {
  if (accessKey.value.trim() === VALID_KEY) {
    authMessage.style.color = "#4ade80";
    authMessage.textContent = "Доступ разрешён";
    authBlock.style.display = "none";
    signals.style.display = "block";
  } else {
    authMessage.style.color = "#ef4444";
    authMessage.textContent = "Неверный ключ";
  }
};

classicBtn.onclick = () => {
  classicMarket.style.display = "block";
  otcMarket.style.display = "none";
  classicBtn.classList.add("activeTab");
  otcBtn.classList.remove("activeTab");
};

otcBtn.onclick = () => {
  classicMarket.style.display = "none";
  otcMarket.style.display = "block";
  otcBtn.classList.add("activeTab");
  classicBtn.classList.remove("activeTab");
};

getSignalBtn.onclick = () => {
  const dir = Math.random() > 0.5 ? "📈 ВВЕРХ" : "📉 ВНИЗ";
  const acc = (70 + Math.random() * 25).toFixed(1);
  signalDisplay.innerHTML = `${dir}<br>Точность: ${acc}%`;
};
</script>

</body>
</html>

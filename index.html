<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐶 DOG SIGNALS</title>

<style>
body{
  font-family:Inter,sans-serif;
  background:radial-gradient(circle at top,#1a0000 0%,#000 90%);
  color:#fff;
  margin:0;
  text-align:center;
}
.header{
  background:linear-gradient(180deg,#220000,transparent);
  padding:18px 0 10px;
}
.header h1{
  margin:0;
  color:#ff3b3b;
  text-shadow:0 0 20px #ff000099;
}
.controls{
  display:flex;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
  margin:14px auto;
}
button{
  width:170px;
  padding:12px 0;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:600;
  background:linear-gradient(180deg,#ff3b3b,#b30000);
  color:#fff;
  cursor:pointer;
}
button:hover{transform:scale(1.05);}
button:disabled{opacity:.5;cursor:not-allowed;}
select,input{
  background:#110000;
  border:1px solid #330000;
  border-radius:10px;
  color:#ffcccc;
  padding:10px 14px;
  font-size:16px;
}
.activeTab{background:#cc0000!important;}
#authBlock{margin-top:70px;}
#signals{display:none;}
#signalDisplay,#otcSignalDisplay{
  font-size:20px;
  min-height:90px;
  margin-top:15px;
}
#tv_chart_container{
  width:94%;
  max-width:450px;
  height:330px;
  margin:15px auto;
  border-radius:12px;
  border:1px solid #330000;
  background:#080000;
}
@keyframes blinkUp{0%,100%{color:#4ade80}50%{color:#fff}}
@keyframes blinkDown{0%,100%{color:#ef4444}50%{color:#fff}}
</style>
</head>

<body>

<div class="header">
  <h1>🐶 DOG SIGNALS</h1>
</div>

<div class="controls">
  <button id="openAuthBtn">🔐 Пароль</button>
</div>

<!-- ПАРОЛЬ -->
<div id="authBlock">
  <p>Введите ключ доступа:</p>
  <input id="accessKey" placeholder="Введите ключ">
  <br><br>
  <button id="checkKeyBtn">Проверить</button>
  <p id="authMessage"></p>
</div>

<!-- СИГНАЛЫ -->
<div id="signals">

  <div class="controls">
    <button id="classicBtn" class="activeTab">💱 Обычный рынок</button>
    <button id="otcBtn">📊 OTC рынок</button>
  </div>

  <!-- CLASSIC -->
  <div id="classicMarket">
    <div class="controls">
      <select id="pairSelect">
        <option>EUR/USD</option><option>GBP/USD</option><option>USD/JPY</option>
        <option>USD/CHF</option><option>AUD/USD</option><option>NZD/USD</option>
        <option>EUR/JPY</option><option>GBP/JPY</option><option>EUR/GBP</option>
        <option>CAD/JPY</option><option>AUD/JPY</option><option>GBP/AUD</option>
        <option>USD/CAD</option>
      </select>
      <select id="tfSelect">
        <option value="1">1M</option>
        <option value="3">3M</option>
        <option value="5">5M</option>
        <option value="7">7M</option>
      </select>
    </div>

    <div class="controls">
      <button id="getSignalBtn">🔥 Получить сигнал</button>
      <button id="resetSignalBtn" disabled>♻ Сбросить</button>
    </div>

    <div id="signalDisplay"></div>
    <div id="tv_chart_container"></div>
  </div>

  <!-- OTC -->
  <div id="otcMarket" style="display:none;">
    <div class="controls">
      <select id="otcPairSelect">
        <option>EUR/USD OTC</option><option>GBP/USD OTC</option>
        <option>USD/JPY OTC</option><option>EUR/JPY OTC</option>
        <option>AUD/USD OTC</option><option>USD/CAD OTC</option>
      </select>
      <select id="otcTfSelect">
        <option value="5">5 сек</option>
        <option value="10">10 сек</option>
        <option value="30">30 сек</option>
        <option value="60">1 мин</option>
        <option value="120">2 мин</option>
        <option value="300">5 мин</option>
      </select>
    </div>

    <div class="controls">
      <button id="getOtcSignalBtn">⚡ Сигнал OTC</button>
      <button id="resetOtcSignalBtn" disabled>♻ Сбросить</button>
    </div>

    <div id="otcSignalDisplay"></div>
  </div>

</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
const VALID_KEY="DOG2025";

openAuthBtn.onclick=()=>{
  authBlock.style.display="block";
  signals.style.display="none";
  authMessage.textContent="";
  accessKey.value="";
};

checkKeyBtn.onclick=()=>{
  if(accessKey.value.trim()===VALID_KEY){
    authMessage.style.color="#4ade80";
    authMessage.textContent="Доступ разрешён";
    authBlock.style.display="none";
    signals.style.display="block";
  }else{
    authMessage.style.color="#ef4444";
    authMessage.textContent="Неверный ключ";
  }
};

classicBtn.onclick=()=>{
  classicMarket.style.display="block";
  otcMarket.style.display="none";
  classicBtn.classList.add("activeTab");
  otcBtn.classList.remove("activeTab");
};

otcBtn.onclick=()=>{
  classicMarket.style.display="none";
  otcMarket.style.display="block";
  otcBtn.classList.add("activeTab");
  classicBtn.classList.remove("activeTab");
};

function loadTV(pair,tf){
  tv_chart_container.innerHTML="";
  new TradingView.widget({
    container_id:"tv_chart_container",
    symbol:"FX:"+pair.replace("/",""),
    interval:tf,
    theme:"dark",
    style:1,
    width:"100%",
    height:"100%",
    hide_top_toolbar:true
  });
}

function genSignal(){
  return{
    dir:Math.random()>0.5?"UP":"DOWN",
    acc:(70+Math.random()*25).toFixed(1)
  };
}

let timer=null;

getSignalBtn.onclick=()=>{
  const pair=pairSelect.value;
  const tf=tfSelect.value;
  const s=genSignal();

  loadTV(pair,tf);

  signalDisplay.innerHTML=
    `<div style="font-size:26px;font-weight:700;animation:${s.dir==="UP"?"blinkUp":"blinkDown"} 1s infinite">
      ${s.dir==="UP"?"📈 ВВЕРХ":"📉 ВНИЗ"}
     </div>
     <div>Точность: ${s.acc}%</div>`;

  getSignalBtn.disabled=true;
  resetSignalBtn.disabled=false;
};

resetSignalBtn.onclick=()=>{
  signalDisplay.innerHTML="";
  tv_chart_container.innerHTML="";
  getSignalBtn.disabled=false;
  resetSignalBtn.disabled=true;
};

getOtcSignalBtn.onclick=()=>{
  const s=genSignal();
  otcSignalDisplay.innerHTML=
    `<div style="font-size:26px;font-weight:700;animation:${s.dir==="UP"?"blinkUp":"blinkDown"} 1s infinite">
      ${s.dir==="UP"?"📈 ВВЕРХ":"📉 ВНИЗ"}
     </div>
     <div>Точность: ${s.acc}%</div>`;
  getOtcSignalBtn.disabled=true;
  resetOtcSignalBtn.disabled=false;
};

resetOtcSignalBtn.onclick=()=>{
  otcSignalDisplay.innerHTML="";
  getOtcSignalBtn.disabled=false;
  resetOtcSignalBtn.disabled=true;
};
</script>

</body>
</html>

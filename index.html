<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🐶 DOG SIGNALS</title>

<style>
body{
  font-family: Inter, sans-serif;
  background: radial-gradient(circle at top,#1a0000 0%,#000 90%);
  color:#fff;text-align:center;margin:0
}
.header{padding:18px 0}
.header h1{color:#ff3b3b;font-size:28px}
button{
  border:none;border-radius:12px;font-size:16px;
  padding:12px;width:170px;
  background:linear-gradient(180deg,#ff3b3b,#b30000);
  color:#fff;cursor:pointer
}
button:disabled{opacity:.5}
.controls{display:flex;justify-content:center;gap:14px;margin:14px;flex-wrap:wrap}
select,input{
  background:#110000;border:1px solid #330000;
  border-radius:10px;color:#ffcccc;
  padding:10px;font-size:16px
}
#tv_chart_container{
  width:94%;max-width:450px;height:330px;
  margin:10px auto;border-radius:12px;
  border:1px solid #330000;overflow:hidden
}
@keyframes up{0%,100%{color:#4ade80}50%{color:#fff}}
@keyframes down{0%,100%{color:#ef4444}50%{color:#fff}}
</style>
</head>

<body>

<div class="header"><h1>🐶 DOG SIGNALS</h1></div>

<div id="authBlock">
  <p>Введите пароль:</p>
  <input id="accessKey" placeholder="Пароль">
  <br><br>
  <button id="checkKeyBtn">🔐 Войти</button>
  <p id="authMessage"></p>
</div>

<div id="signals" style="display:none">

  <div class="controls">
    <select id="pairSelect">
      <option>EUR/USD</option><option>GBP/USD</option>
      <option>USD/JPY</option><option>AUD/USD</option>
      <option>USD/CAD</option><option>EUR/JPY</option>
    </select>
    <select id="tfSelect">
      <option value="1">1M</option>
      <option value="3">3M</option>
      <option value="5">5M</option>
    </select>
  </div>

  <div class="controls">
    <button id="getSignalBtn">🔥 Получить сигнал</button>
    <button id="resetSignalBtn" disabled>♻ Сброс</button>
  </div>

  <div id="signalDisplay"></div>
  <div id="tv_chart_container"></div>

</div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>
/* ---------- ПАРОЛЬ ---------- */
const VALID_KEY="DOG2025";
checkKeyBtn.onclick=()=>{
  if(accessKey.value===VALID_KEY){
    authBlock.style.display="none";
    signals.style.display="block";
    localStorage.setItem("dog_access","1");
  }else authMessage.textContent="❌ Неверный пароль";
}
if(localStorage.getItem("dog_access")){
  authBlock.style.display="none";
  signals.style.display="block";
}

/* ---------- TRADINGVIEW FIX ---------- */
let tvWidget=null;

function initTV(pair,tf){
  if(tvWidget) return;
  tvWidget=new TradingView.widget({
    container_id:"tv_chart_container",
    symbol:"FX:"+pair.replace("/",""),
    interval:tf,
    theme:"dark",
    hide_top_toolbar:true,
    width:"100%",height:"100%"
  });
}

function updateTV(pair,tf){
  if(!tvWidget) return;
  tvWidget.onChartReady(()=>{
    tvWidget.chart().setSymbol(
      "FX:"+pair.replace("/",""), tf
    );
  });
}

/* ---------- СИГНАЛЫ ---------- */
let timer=null,signal=null;

function genSignal(){
  return{
    dir:Math.random()>0.5?"UP":"DOWN",
    acc:(70+Math.random()*25).toFixed(1),
    time:60
  }
}

getSignalBtn.onclick=()=>{
  const pair=pairSelect.value;
  const tf=+tfSelect.value;
  initTV(pair,tf);
  updateTV(pair,tf);

  signal=genSignal();
  getSignalBtn.disabled=true;
  resetSignalBtn.disabled=false;

  timer=setInterval(()=>{
    if(signal.time>0){
      signal.time--;
      signalDisplay.innerHTML=`
        <div style="font-size:26px;animation:${signal.dir==="UP"?"up":"down"} 1s infinite">
          ${signal.dir==="UP"?"📈 ВВЕРХ":"📉 ВНИЗ"}
        </div>
        <div>Точность: ${signal.acc}%</div>
        <div>⏳ Осталось: ${signal.time} сек</div>`;
    }else{
      clearInterval(timer);
    }
  },1000);
}

resetSignalBtn.onclick=()=>{
  clearInterval(timer);
  signalDisplay.innerHTML="";
  getSignalBtn.disabled=false;
  resetSignalBtn.disabled=true;
}
</script>

</body>
</html>

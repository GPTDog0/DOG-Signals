<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐶 DOG SIGNALS CYBERPUNK</title>
<style>
body{
  margin:0;
  font-family:Inter,sans-serif;
  overflow-x:hidden;
  background:#050005;
  color:#fff;
}

header{
  padding:30px;
  text-align:center;
  font-size:28px;
  font-weight:700;
  letter-spacing:2px;
  text-shadow:0 0 10px #ff0080,0 0 20px #ff00c0;
}

/* интерактивный фон */
#bgCanvas{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  z-index:-1;
}

/* кнопки и селекты */
.controls{
  display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:20px;
}
button{
  padding:12px 18px;
  border:none;border-radius:12px;
  cursor:pointer;
  font-weight:600;
  color:#fff;
  background:linear-gradient(180deg,#ff00aa,#800050);
  box-shadow:0 0 15px rgba(255,0,200,.5);
  transition:.25s;
}
button:hover{transform:translateY(-2px);box-shadow:0 0 25px rgba(255,0,200,.9);}
button:disabled{opacity:.4;}
select,input{
  padding:10px;border-radius:10px;border:1px solid #440044;background:#0f001f;color:#ff99cc;
}

/* активные вкладки */
.activeTab{background:#ff00aa!important;}

/* карточки сигналов */
.signalCard{
  background:rgba(20,0,20,0.75);
  border:1px solid rgba(255,0,200,.2);
  border-radius:20px;
  padding:25px;
  width:300px;
  margin:auto;
  backdrop-filter:blur(12px);
  box-shadow:0 0 30px rgba(255,0,200,.3);
  transition:.3s;
  text-align:center;
}
.signalArrow{
  font-size:42px;font-weight:700;
}
.up{color:#4ade80;animation:upPulse 1s infinite;}
.down{color:#ef4444;animation:downPulse 1s infinite;}
@keyframes upPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes downPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

.loader{
  width:45px;height:45px;
  border:4px solid #220022;border-top:4px solid #ff00aa;
  border-radius:50%;margin:auto;
  animation:spin 1s linear infinite;
}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}

/* график TradingView */
#tv_chart_container{
  width:94%;max-width:450px;height:320px;margin:25px auto;
  border-radius:14px;border:1px solid #330033;overflow:hidden;
}

/* скрываем сигналы до авторизации */
#signals{display:none;}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<header>🐶 DOG SIGNALS CYBERPUNK</header>

<div class="controls">
  <button id="openAuthBtn">🔐 Ввести ключ доступа</button>
</div>

<div id="authBlock">
  <p>Введите ключ доступа:</p>
  <input id="accessKey" placeholder="Введите ключ">
  <br><br>
  <button id="checkKeyBtn">Проверить</button>
  <p id="authMessage"></p>
</div>

<div id="signals">

  <div class="controls">
    <button id="classicBtn" class="activeTab">💱 Обычный рынок</button>
    <button id="otcBtn">📊 OTC рынок</button>
  </div>

  <div id="classicMarket">
    <div class="controls">
      <select id="pairSelect">
        <option>EUR/USD</option><option>GBP/USD</option><option>USD/JPY</option>
      </select>
      <select id="tfSelect">
        <option value="60">1M</option><option value="180">3M</option><option value="300">5M</option>
      </select>
    </div>
    <div class="controls">
      <button id="getSignalBtn">🔥 Получить сигнал</button>
      <button id="resetSignalBtn" disabled>♻ Сбросить</button>
    </div>
    <div id="signalDisplay"></div>
    <div id="tv_chart_container"></div>
  </div>

  <div id="otcMarket" style="display:none;">
    <div class="controls">
      <select id="otcPairSelect"><option>EUR/USD OTC</option></select>
      <select id="otcTfSelect"><option value="60">1 мин</option></select>
    </div>
    <div class="controls">
      <button id="getOtcSignalBtn">⚡ Сигнал OTC</button>
      <button id="resetOtcSignalBtn" disabled>♻ Сбросить</button>
    </div>
    <div id="otcSignalDisplay"></div>
  </div>

</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
// ========= ЛОГИКА АВТОРИЗАЦИИ =========
const VALID_KEY="DOG2025";
openAuthBtn.onclick=()=>{authBlock.style.display="block";signals.style.display="none";}
checkKeyBtn.onclick=()=>{
  if(accessKey.value.trim()===VALID_KEY){
    authBlock.style.display="none";signals.style.display="block";
    authMessage.textContent="✅ Доступ разрешён";authMessage.style.color="#4ade80";
  }else{
    authMessage.textContent="❌ Неверный ключ";authMessage.style.color="#ef4444";
  }
};

// ========= ПЕРЕКЛЮЧЕНИЕ РЫНКОВ =========
classicBtn.onclick=()=>{classicMarket.style.display="block";otcMarket.style.display="none";classicBtn.classList.add("activeTab");otcBtn.classList.remove("activeTab");}
otcBtn.onclick=()=>{classicMarket.style.display="none";otcMarket.style.display="block";otcBtn.classList.add("activeTab");classicBtn.classList.remove("activeTab");}

// ========= TRADINGVIEW =========
function loadTV(pair,tf){
  tv_chart_container.innerHTML="";
  new TradingView.widget({container_id:"tv_chart_container",symbol:"FX:"+pair.replace("/",""),interval:Math.max(1,tf/60),theme:"dark",hide_top_toolbar:true,width:"100%",height:"100%"});
}

// ========= ГЕНЕРАЦИЯ СИГНАЛА =========
function genSignal(){return {dir:Math.random()>0.5?"UP":"DOWN", acc:(70+Math.random()*25).toFixed(1)};}

let timer=null,remaining=0,currentSignal=null;
function startTimer(sec, display, onEnd){
  remaining=sec;
  timer=setInterval(()=>{remaining--;display();if(remaining<=0){clearInterval(timer);onEnd();}},1000);
}

// ========= CLASSIC SIGNAL =========
getSignalBtn.onclick=()=>{
  signalDisplay.innerHTML=`<div class="signalCard"><div class="loader"></div><p style="margin-top:10px">🐶 DOG AI анализирует рынок...</p></div>`;
  setTimeout(()=>{
    const pair=pairSelect.value,tf=+tfSelect.value;
    currentSignal=genSignal();
    loadTV(pair,tf);
    getSignalBtn.disabled=true;resetSignalBtn.disabled=false;
    startTimer(tf, ()=>{
      signalDisplay.innerHTML=`<div class="signalCard"><div class="signalArrow ${currentSignal.dir==="UP"?"up":"down"}">${currentSignal.dir==="UP"?"📈 BUY":"📉 SELL"}</div><p>Accuracy: ${currentSignal.acc}%</p><p>⏳ ${remaining} sec</p></div>`;
    },()=>{signalDisplay.innerHTML+=`<p>Signal finished</p>`});
  },2000);
};
resetSignalBtn.onclick=()=>{clearInterval(timer);signalDisplay.innerHTML="";tv_chart_container.innerHTML="";getSignalBtn.disabled=false;resetSignalBtn.disabled=true;}

// ========= OTC SIGNAL =========
getOtcSignalBtn.onclick=()=>{
  otcSignalDisplay.innerHTML=`<div class="signalCard"><div class="loader"></div><p style="margin-top:10px">🐶 DOG AI анализирует рынок OTC...</p></div>`;
  setTimeout(()=>{
    const tf=+otcTfSelect.value;
    currentSignal=genSignal();
    getOtcSignalBtn.disabled=true;resetOtcSignalBtn.disabled=false;
    startTimer(tf, ()=>{
      otcSignalDisplay.innerHTML=`<div class="signalCard"><div class="signalArrow ${currentSignal.dir==="UP"?"up":"down"}">${currentSignal.dir==="UP"?"📈 BUY":"📉 SELL"}</div><p>Accuracy: ${currentSignal.acc}%</p><p>⏳ ${remaining} sec</p></div>`;
    },()=>{otcSignalDisplay.innerHTML+=`<p>Signal finished</p>`});
  },2000);
};
resetOtcSignalBtn.onclick=()=>{clearInterval(timer);otcSignalDisplay.innerHTML="";getOtcSignalBtn.disabled=false;resetOtcSignalBtn.disabled=true;}

// ========= ИНТЕРАКТИВНЫЙ ФОН =========
const canvas=document.getElementById("bgCanvas"),ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
let particles=[];
for(let i=0;i<120;i++){particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,dx:(Math.random()-0.5)*1.2,dy:(Math.random()-0.5)*1.2,size:Math.random()*2+1})}
function animateParticles(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    ctx.fillStyle="rgba(255,0,200,0.5)";
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
    p.x+=p.dx;p.y+=p.dy;
    if(p.x<0)p.x=canvas.width;if(p.x>canvas.width)p.x=0;
    if(p.y<0)p.y=canvas.height;if(p.y>canvas.height)p.y=0;
  });
  requestAnimationFrame(animateParticles);
}
animateParticles();
window.onresize=()=>{canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐶 DOG SIGNALS</title>
<style>
body {
  font-family: "Inter", sans-serif;
  background: radial-gradient(circle at top, #1a0000 0%, #000 90%);
  color:#fff;
  text-align:center;
  margin:0;
  padding:0;
  overflow-y:auto;
}
.header {
  background: linear-gradient(180deg, #220000, transparent);
  padding: 18px 0 10px;
  box-shadow:0 0 25px #ff000020;
}
.header h1 {
  color:#ff3b3b;
  font-size:28px;
  font-weight:700;
  margin:0;
  text-shadow:0 0 20px #ff000099;
}
input {
  padding:12px;
  border-radius:10px;
  border:1px solid #330000;
  background:#1a0000;
  color:#ffcccc;
  font-size:16px;
  width:200px;
  margin-top:15px;
  outline:none;
}
button {
  margin-top:15px;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:600;
  padding:10px 20px;
  color:#fff;
  background: linear-gradient(180deg,#ff3b3b,#b30000);
  box-shadow:0 0 12px #ff000040;
  cursor:pointer;
  transition:.25s;
}
button:hover { transform:scale(1.05); box-shadow:0 0 20px #ff000080; }
#authMessage { margin-top:10px; font-size:16px; }
#signals { display:none; margin-top:20px; }
.controls{
  display:flex;
  justify-content:center;
  gap:14px;
  margin:14px auto 18px;
  flex-wrap:wrap;
}
select{
  background:#110000;
  border:1px solid #330000;
  border-radius:10px;
  color:#ffcdcd;
  padding:10px 14px;
  font-size:16px;
  outline:none;
  transition: .2s;
}
select:hover{ border-color:#ff3b3b; box-shadow:0 0 10px #ff000040; }
#tv_chart_container{
  width:94%;
  max-width:450px;
  height:400px;
  margin:10px auto 20px;
  border-radius:12px;
  background:#080000;
  border:1px solid #330000;
  box-shadow:0 0 25px #ff000020;
  overflow:hidden;
  position:relative;
}
#signalDisplay, #otcSignalDisplay {
  font-size:20px;
  margin:15px 0;
  text-shadow:0 0 8px #ff000040;
  min-height:90px;
}
@keyframes blinkUp{0%,100%{color:#4ade80; text-shadow:0 0 15px #22ff22;}50%{color:#fff; text-shadow:0 0 5px #fff;}}
@keyframes blinkDown{0%,100%{color:#ef4444; text-shadow:0 0 15px #ff2222;}50%{color:#fff; text-shadow:0 0 5px #fff;}}
.timer{ animation: blinkUp 1s infinite; }
.activeTab { background: linear-gradient(180deg,#ff6666,#cc0000)!important; }
.small{ width:125px; }
#langSelect {
  position: fixed;
  top: 12px;
  right: 12px;
  background: #1a0000;
  border: 1px solid #330000;
  padding: 8px 12px;
  border-radius: 8px;
  color: #ffcccc;
}
</style>
</head>
<body>

<select id="langSelect">
  <option value="ru">🇷🇺 Русский</option>
  <option value="en">🇬🇧 English</option>
</select>

<div class="header"><h1>🐶 DOG SIGNALS</h1></div>

<!-- ===== ПРИВЕТСТВИЕ И ПАРОЛЬ ===== -->
<div id="authBlock">
  <h2>👋 Добро пожаловать!</h2>
  <p id="authText">Для доступа к сигналам введите пароль:</p>
  <input type="password" id="accessKey" placeholder="Введите пароль...">
  <br>
  <button id="checkKeyBtn">🔐 Проверить</button>
  <p id="authMessage"></p>
</div>

<!-- ===== СИГНАЛЫ ===== -->
<div id="signals">
  <div class="controls">
    <button id="classicBtn" class="activeTab">💱 Обычный рынок</button>
    <button id="otcBtn">📊 OTC рынок</button>
  </div>

  <!-- ===== КЛАССИЧЕСКИЙ РЫНОК ===== -->
  <div id="classicMarket">
    <div class="controls">
      <select id="pairSelect">
        <option>EUR/USD</option><option>GBP/USD</option><option>USD/JPY</option>
        <option>USD/CHF</option><option>AUD/USD</option><option>NZD/USD</option>
      </select>
      <select id="tfSelect">
        <option value="1m">1M</option><option value="5m">5M</option>
        <option value="15m">15M</option><option value="1h">1H</option>
      </select>
    </div>
    <div class="controls">
      <button id="getSignalBtn">🔥 Получить сигнал</button>
      <button id="resetSignalBtn" disabled>♻ Сбросить</button>
    </div>
    <div id="signalDisplay"></div>
    <div id="tv_chart_container"></div>
  </div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
// ===== ЯЗЫК =====
const translations = {
  ru: {authText:"Для доступа к сигналам введите пароль:",signalUp:"📈 Вверх ↑",signalDown:"📉 Вниз ↓",accuracy:"Точность",timer:"Таймер"},
  en: {authText:"Enter password to access signals:",signalUp:"📈 Up ↑",signalDown:"📉 Down ↓",accuracy:"Accuracy",timer:"Timer"}
};
const langSelect=document.getElementById("langSelect");
const authText=document.getElementById("authText");
langSelect.onchange=()=>{const t=translations[langSelect.value]; authText.textContent=t.authText; updateDisplay(); updateOtc();}

// ===== ПАРОЛЬ =====
const VALID_KEY = "DOG2025";
const accessKey = document.getElementById("accessKey");
const checkKeyBtn = document.getElementById("checkKeyBtn");
const authMessage = document.getElementById("authMessage");
const authBlock = document.getElementById("authBlock");
const signals = document.getElementById("signals");

checkKeyBtn.onclick = () => {
  if(accessKey.value.trim() === VALID_KEY){
    authMessage.style.color = "#4ade80";
    authMessage.textContent = "✅ Пароль верный, доступ открыт!";
    authBlock.style.display = "none";
    signals.style.display = "block";
    localStorage.setItem("dogsignals_access","granted");
  } else {
    authMessage.style.color = "#ef4444";
    authMessage.textContent = "❌ Неверный пароль!";
  }
}

if(localStorage.getItem("dogsignals_access")==="granted"){
  authBlock.style.display="none";
  signals.style.display="block";
}

// ===== ТАБЫ =====
const classicBtn = document.getElementById("classicBtn");
const classicMarket = document.getElementById("classicMarket");

classicBtn.onclick = () => { classicMarket.style.display="block"; }

// ===== СИГНАЛЫ И ГРАФИК =====
const pairSelect = document.getElementById("pairSelect");
const tfSelect = document.getElementById("tfSelect");
const getSignalBtn = document.getElementById("getSignalBtn");
const resetSignalBtn = document.getElementById("resetSignalBtn");
const signalDisplay = document.getElementById("signalDisplay");
const tv_chart_container = document.getElementById("tv_chart_container");

let activeSignal=null, timer=null;

function genSignal(){ return {dir:Math.random()>0.5?"UP":"DOWN", acc:(70+Math.random()*25).toFixed(1)} }
function tfSeconds(tf){ return 60; } // простой таймер, для демонстрации
function updateDisplay(){
  if(!activeSignal) return;
  const t = translations[langSelect.value];
  signalDisplay.innerHTML=`<div style="font-size:24px;font-weight:700;animation:${activeSignal.dir==="UP"?"blinkUp":"blinkDown"} 1s infinite">${activeSignal.dir==="UP"?t.signalUp:t.signalDown}</div><div>${t.accuracy}: ${activeSignal.acc}%</div><div>${t.timer}: ${activeSignal.rem}s</div>`;
}

getSignalBtn.onclick = () => {
  const pair = pairSelect.value, tf = tfSelect.value;
  activeSignal = genSignal(); activeSignal.rem = tfSeconds(tf);

  // Реальный график TradingView
  tv_chart_container.innerHTML="";
  new TradingView.widget({
    container_id: "tv_chart_container",
    width: "100%",
    height: "100%",
    symbol: pair.replace("/",""),
    interval: tf.replace("m",""),
    theme: "dark",
    style: 1,
    toolbar_bg: "#000000",
    withdateranges: true,
    hide_top_toolbar: true,
    allow_symbol_change: true,
    locale: langSelect.value
  });

  updateDisplay();
  getSignalBtn.disabled=true; resetSignalBtn.disabled=false;

  timer=setInterval(()=>{
    if(activeSignal.rem>0){ activeSignal.rem--; updateDisplay(); }
    else{ clearInterval(timer); updateDisplay(); }
  },1000);
}

resetSignalBtn.onclick = () => {
  clearInterval(timer); activeSignal=null; signalDisplay.innerHTML="";
  tv_chart_container.innerHTML=""; getSignalBtn.disabled=false; resetSignalBtn.disabled=true;
}
</script>
</body>
</html>

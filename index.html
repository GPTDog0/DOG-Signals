<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🐶 DOG SIGNALS</title>

<style>
body {
  font-family: "Inter", sans-serif;
  background: radial-gradient(circle at top, #1a0000 0%, #000 90%);
  color:#fff;
  text-align:center;
  margin:0;
  padding:0;
}
.header { background: linear-gradient(180deg, #220000, transparent); padding: 18px 0 10px; box-shadow:0 0 25px #ff000020; }
.header h1 { color:#ff3b3b; font-size:28px; font-weight:700; margin:0; text-shadow:0 0 20px #ff000099; }
button { border:none; border-radius:12px; font-size:16px; font-weight:600; padding:12px 0; width:180px; color:#fff; background: linear-gradient(180deg,#ff3b3b,#b30000); box-shadow:0 0 12px #ff000040; transition:.25s; cursor:pointer; margin-top:10px; }
button:hover{ transform:scale(1.06); box-shadow:0 0 20px #ff000080; }
input { padding:10px 12px; border-radius:10px; border:1px solid #330000; background:#1a0000; color:#ffcccc; width:190px; font-size:16px; }
#welcomeBlock, #passwordBlock, #signals { margin-top:50px; }
#signals { display:none; }
#passwordBlock { display:none; }
#authMessage { color:#ff4444; margin-top:10px; }
.controls { display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin-top:10px; }
.activeTab { background: linear-gradient(180deg,#ff6666,#cc0000)!important; }
</style>
</head>
<body>

<div class="header"><h1>🐶 DOG SIGNALS</h1></div>

<!-- ===== ПРИВЕТСТВИЕ ===== -->
<div id="welcomeBlock">
  <h2>👋 Добро пожаловать!</h2>
  <p>Нажмите кнопку, чтобы получить доступ к сигналам:</p>
  <button id="showPasswordBtn">➡ Получить сигналы</button>
</div>

<!-- ===== ВВОД ПАРОЛЯ ===== -->
<div id="passwordBlock">
  <p>Введите пароль для доступа:</p>
  <input type="password" id="accessKey" placeholder="Пароль...">
  <br>
  <button id="checkKeyBtn">🔐 Проверить</button>
  <p id="authMessage"></p>
</div>

<!-- ===== СИГНАЛЫ ===== -->
<div id="signals">
  <div class="controls">
    <button id="classicBtn" class="activeTab">💱 Обычный рынок</button>
    <button id="otcBtn">📊 OTC рынок</button>
  </div>

  <div id="classicMarket">
    <div class="controls">
      <select id="pairSelect">
        <option>EUR/USD</option><option>GBP/USD</option><option>USD/JPY</option>
      </select>
      <select id="tfSelect">
        <option value="1m">1M</option><option value="3m">3M</option>
      </select>
    </div>
    <div class="controls">
      <button id="getSignalBtn">🔥 Получить сигнал</button>
      <button id="resetSignalBtn" disabled>♻ Сбросить</button>
    </div>
    <div id="signalDisplay"></div>
    <div id="tv_chart_container" style="width:94%;max-width:450px;height:330px;margin:10px auto 20px;background:#080000;"></div>
  </div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
// ===== КНОПКИ =====
const showPasswordBtn = document.getElementById("showPasswordBtn");
const passwordBlock = document.getElementById("passwordBlock");
const welcomeBlock = document.getElementById("welcomeBlock");
const checkKeyBtn = document.getElementById("checkKeyBtn");
const accessKey = document.getElementById("accessKey");
const authMessage = document.getElementById("authMessage");
const signals = document.getElementById("signals");

showPasswordBtn.onclick = () => {
  welcomeBlock.style.display = "none";
  passwordBlock.style.display = "block";
}

// ===== ПРОВЕРКА ПАРОЛЯ =====
const VALID_KEY = "DOG2025";
checkKeyBtn.onclick = () => {
  if(accessKey.value.trim() === VALID_KEY){
    passwordBlock.style.display = "none";
    signals.style.display = "block";
  } else {
    authMessage.textContent = "❌ Неверный пароль!";
  }
}

// ===== ТАБЫ =====
const classicBtn = document.getElementById("classicBtn");
const otcBtn = document.getElementById("otcBtn");
const classicMarket = document.getElementById("classicMarket");
const otcMarket = document.getElementById("otcMarket");

classicBtn.onclick = () => {
  classicMarket.style.display = "block";
  otcMarket && (otcMarket.style.display = "none");
  classicBtn.classList.add("activeTab");
  otcBtn.classList.remove("activeTab");
}

otcBtn && (otcBtn.onclick = () => {
  classicMarket.style.display = "none";
  otcMarket.style.display = "block";
  otcBtn.classList.add("activeTab");
  classicBtn.classList.remove("activeTab");
})
</script>

</body>
</html>

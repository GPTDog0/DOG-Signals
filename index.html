<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐶 DOG SIGNALS</title>
<style>
body {
  font-family: "Inter", sans-serif;
  background: radial-gradient(circle at top, #1a0000 0%, #000 90%);
  color:#fff;
  text-align:center;
  margin:0;
  padding:0;
}
.header {background: linear-gradient(180deg, #220000, transparent);padding: 18px 0 10px;box-shadow:0 0 25px #ff000020;}
.header h1 {color:#ff3b3b;font-size:28px;font-weight:700;margin:0;text-shadow:0 0 20px #ff000099;}
button {border:none;border-radius:12px;font-size:16px;font-weight:600;padding:12px 0;width:170px;color:#fff;background: linear-gradient(180deg,#ff3b3b,#b30000);box-shadow:0 0 12px #ff000040;transition:.25s;cursor:pointer;}
button:hover{transform:scale(1.06);box-shadow:0 0 20px #ff000080;}
button:disabled{opacity:.5;background:#330000;cursor:not-allowed;}
.controls{display:flex;justify-content:center;gap:14px;margin:14px auto 18px;flex-wrap:wrap;}
select{background:#110000;border:1px solid #330000;border-radius:10px;color:#ffcdcd;padding:10px 14px;font-size:16px;outline:none;transition: .2s;}
select:hover{border-color:#ff3b3b;box-shadow:0 0 10px #ff000040;}
#tv_chart_container{width:94%;max-width:450px;height:330px;margin:10px auto 20px;border-radius:12px;background:#080000;border:1px solid #330000;box-shadow:0 0 25px #ff000020;overflow:hidden;position:relative;}
#signalDisplay,#otcSignalDisplay{font-size:20px;margin:15px 0;text-shadow:0 0 8px #ff000040;min-height:90px;}
@keyframes blinkUp{0%,100%{color:#4ade80; text-shadow:0 0 15px #22ff22;}50%{color:#fff;text-shadow:0 0 5px #fff;}}
@keyframes blinkDown{0%,100%{color:#ef4444; text-shadow:0 0 15px #ff2222;}50%{color:#fff;text-shadow:0 0 5px #fff;}}
.timer{animation: blinkUp 1s infinite;}
#authBlock{margin-top:70px;}
#authBlock input{padding:10px 12px;border-radius:10px;border:1px solid #330000;background:#1a0000;color:#ffcccc;width:190px;font-size:16px;}
#langSelect{position: fixed;top: 12px;right: 12px;background: #1a0000;border: 1px solid #330000;padding: 8px 12px;border-radius: 8px;color: #ffcccc;}
</style>
</head>
<body>

<select id="langSelect">
  <option value="ru">🇷🇺 Русский</option>
  <option value="en">🇬🇧 English</option>
</select>

<div class="header"><h1>🐶 DOG SIGNALS</h1></div>

<!-- ===== ЭКРАН ПРИВЕТСТВИЯ И ПАРОЛЯ ===== -->
<div id="authBlock">
  <p id="authTitle">Введите ваш ключ доступа:</p>
  <input type="text" id="accessKey" placeholder="Введите ключ...">
  <button id="checkKeyBtn">🔐 Проверить</button>
  <p id="authMessage" style="color:#ff4444;margin-top:10px;"></p>
</div>

<!-- ===== ОСНОВНОЙ КОНТЕНТ (СКРЫТ) ===== -->
<div id="signals" style="display:none;">
  <div class="controls">
    <button id="classicBtn" class="activeTab">💱 Обычный рынок</button>
    <button id="otcBtn">📊 OTC рынок</button>
  </div>

  <div id="classicMarket">
    <div class="controls">
      <select id="pairSelect">
        <option>EUR/USD</option><option>GBP/USD</option><option>USD/JPY</option>
      </select>
      <select id="tfSelect">
        <option value="1m">1M</option><option value="5m">5M</option>
      </select>
    </div>
    <div class="controls">
      <button id="getSignalBtn">🔥 Получить сигнал</button>
      <button id="resetSignalBtn" disabled>♻ Сбросить</button>
    </div>
    <div id="signalDisplay"></div>
    <div id="tv_chart_container"></div>
  </div>

  <div id="otcMarket" style="display:none;">
    <div class="controls">
      <select id="otcPairSelect">
        <option>EUR/USD OTC</option><option>GBP/USD OTC</option>
      </select>
      <select id="otcTfSelect" class="small">
        <option value="random">🎲 Случайно</option>
        <option value="5s">5 сек</option>
        <option value="10s">10 сек</option>
      </select>
    </div>
    <div class="controls">
      <button id="getOtcSignalBtn">⚡ Сигнал OTC</button>
      <button id="resetOtcSignalBtn" disabled>♻ Сбросить</button>
    </div>
    <div id="otcSignalDisplay"></div>
  </div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
// ===== ЯЗЫК =====
const translations = {
  ru:{authTitle:"Введите ваш ключ доступа:",authPlaceholder:"Введите ключ...",authWrong:"❌ Неверный ключ!",authSuccess:"✅ Доступ разрешён!",classic:"💱 Обычный рынок",otc:"📊 OTC рынок",getSignal:"🔥 Получить сигнал",reset:"♻ Сбросить",getOtc:"⚡ Сигнал OTC",up:"📈 Вверх ↑",down:"📉 Вниз ↓",accuracy:"Точность",timer:"Таймер",tf:"TF",pair:"Пара"},
  en:{authTitle:"Enter access key:",authPlaceholder:"Enter key...",authWrong:"❌ Invalid key!",authSuccess:"✅ Access granted!",classic:"💱 Classic Market",otc:"📊 OTC Market",getSignal:"🔥 Get Signal",reset:"♻ Reset",getOtc:"⚡ Get OTC Signal",up:"📈 Up ↑",down:"📉 Down ↓",accuracy:"Accuracy",timer:"Timer",tf:"TF",pair:"Pair"}
};
const langSelect=document.getElementById("langSelect");
langSelect.onchange=()=>applyLang(langSelect.value);
function applyLang(lang){
  const t=translations[lang];
  authTitle.textContent=t.authTitle;
  accessKey.placeholder=t.authPlaceholder;
  classicBtn.textContent=t.classic;
  otcBtn.textContent=t.otc;
  getSignalBtn.textContent=t.getSignal;
  resetSignalBtn.textContent=t.reset;
  getOtcSignalBtn.textContent=t.getOtc;
  resetOtcSignalBtn.textContent=t.reset;
}
applyLang("ru");

// ===== АВТОРИЗАЦИЯ =====
const VALID_KEY="DOG2025";
checkKeyBtn.onclick=()=>{
  const key=accessKey.value.trim();
  const t=translations[langSelect.value];
  if(key===VALID_KEY){
    authMessage.style.color="#4ade80";
    authMessage.textContent=t.authSuccess;
    authBlock.style.display="none";
    signals.style.display="block";
    localStorage.setItem("dogsignals_access","granted");
  }else{
    authMessage.style.color="#ef4444";
    authMessage.textContent=t.authWrong;
  }
}
if(localStorage.getItem("dogsignals_access")==="granted"){
  authBlock.style.display="none";
  signals.style.display="block";
}

// ===== ТАБЫ =====
classicBtn.onclick=()=>{classicMarket.style.display="block";otcMarket.style.display="none";classicBtn.classList.add("activeTab");otcBtn.classList.remove("activeTab");}
otcBtn.onclick=()=>{classicMarket.style.display="none";otcMarket.style.display="block";otcBtn.classList.add("activeTab");classicBtn.classList.remove("activeTab");}
</script>

</body>
</html>
